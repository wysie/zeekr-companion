name: Build Zeekr Companion APK

on:
  push:
    # main contains the combined fork; feature branches remain independently buildable.
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.apk.outputs.version }}
      title: ${{ steps.apk.outputs.title }}
      prerelease: ${{ steps.apk.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认会装模拟器，我们只是编译 APK 用不到它；
          # 而且它下载失败过一次（Error on ZipFile unknown archive），
          # 白白多一个失败点。Gradle 会自行拉取真正需要的 SDK 组件。
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test release naming and packaging
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # 纯 JVM 单元测试：合成流几何拆分与相机选择逻辑
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage Zeekr Companion APK
        id: apk
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$RELEASE_TAG" ]; then ARGS+=(--tag "$RELEASE_TAG"); fi
          python3 .github/scripts/package_release.py "${ARGS[@]}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeekrCompanion-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.checksum }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: ZeekrCompanion-apk
      # 打 tag 时自动发布 Release，车机/手机可直接下载安装
      # Release 正文由 CHANGELOG.md 里对应版本的小节自动生成，
      # 这样每个版本的说明就是它自己的改动，而不是每次都一样的模板。
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          python3 .github/scripts/release_notes.py "${{ needs.build.outputs.version }}" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.apk
            *.apk.sha256
          # 带后缀的（-alpha / -beta）是测试版；1.0.0 这种不带后缀的是正式版，显示为 Latest
          prerelease: ${{ needs.build.outputs.prerelease }}
          # Review notes and validation before publishing the generated draft.
          draft: true
          name: ${{ needs.build.outputs.title }}
          make_latest: false
          body_path: RELEASE_NOTES.md
