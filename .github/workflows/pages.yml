name: Deploy Zeekr Companion website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/screenshots/**'
      - 'docs/branding/companion-icon.svg'
      - '.github/scripts/build_website.py'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/screenshots/**'
      - 'docs/branding/companion-icon.svg'
      - '.github/scripts/build_website.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website and screenshot sources
        uses: actions/checkout@v4
      - name: Install image encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y webp
      - name: Check website JavaScript
        run: |
          node --check website/app.js
          node --check website/theme-init.js
      - name: Build and validate static website
        run: python3 .github/scripts/build_website.py
      - name: Upload public website only
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
